<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library</title>
  </head>
  <body>
    <div id="main-container">
      <div id="header">
        <h1 id="main-title">My Library</h1>
        <button type="button" id="new-book" class="btn">New Book</button>
      </div>
      <div id="main-content">
        <h2 id="empty-library">Add your books...</h2>
      </div>
    </div>
    <dialog id="modal">
      <div id="modal-header">
        <h2>Book information</h2>
      </div>
      <div id="modal-body">
        <input
          type="text"
          name="name"
          placeholder="Name of the book here..."
          class="modal-input"
          id="bookName"
          required
        />
        <input
          type="text"
          name="author"
          placeholder="Author of the book here..."
          class="modal-input"
          id="bookAuthor"
          required
        />
        <input
          type="number"
          name="pages"
          placeholder="Pages of the book here..."
          class="modal-input"
          id="bookPages"
          required
        />
        <input
          type="text"
          name="genre"
          placeholder="Genre of the book here..."
          class="modal-input"
          id="bookGenre"
          required
        />
        <p id="required-inputs">*All inputs required</p>
        <button type="submit" class="btn" id="modal-btn">Add book</button>
      </div>
    </dialog>
    <script src="./script.js"></script>
  </body>
</html>
